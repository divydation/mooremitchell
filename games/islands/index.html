<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islands</title>
<link rel="icon" type="image/x-icon" href="/m.ico">
<style>
:root{--text:#111827;--mute:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--tc:#1c7ed6;--pos:#15803d;--neg:#dc2626}
*{box-sizing:border-box}
html{font-size:clamp(12px,min(1.05vw,1.9vh),24px)}
body{margin:0;background:#fff;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
.ic{display:block;flex:none}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mute{color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* header */
header{display:flex;align-items:center;gap:1rem;height:3.3rem;padding:0 1.1rem;border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.round{color:var(--mute);font-weight:600}
.steps{display:flex;gap:.5rem;margin:0 auto}
.stp{display:flex;align-items:center;gap:.5rem;padding:.3rem .9rem .3rem .35rem;border-radius:99px;font-weight:700;color:#9ca3af;border:1.5px solid var(--line)}
.stp span{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:var(--soft)}
.stp.on{background:var(--tc);border-color:var(--tc);color:#fff}
.stp.on span{background:#fff;color:var(--tc)}
.stp.done{color:var(--text)}
header .hb{padding:.3rem .8rem;border:1.5px solid var(--line);border-radius:.6rem;font-weight:600;font-size:.9rem}
header .hb:hover{border-color:#9ca3af}

main{flex:1;min-height:0;display:grid;grid-template-columns:24rem minmax(0,1fr) 27rem}

/* sidebar */
#side{border-right:1px solid var(--line);overflow:auto;padding:.6rem;display:flex;flex-direction:column;gap:.5rem}
.row{min-width:0;border:1.5px solid var(--line);border-radius:.8rem;padding:.45rem .6rem;display:grid;gap:.2rem;background:#fff}
.row .l1{display:flex;align-items:center;gap:.5rem}
.row .nm{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mo{font-weight:800}
.row .l2{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.appr{display:flex;align-items:center;gap:.3rem;font-weight:700}
.appr .stars{display:flex}
.lead{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.stats{display:flex}
.st{width:2rem;display:flex;flex-direction:column;align-items:center;gap:.05rem;line-height:1}
.st b{font-size:.95rem;font-weight:800}
.st.hasspec{position:relative}
.st.hasspec b{background:linear-gradient(100deg,#b45309 0%,#b45309 30%,#fde047 42%,#fff 50%,#fde047 58%,#b45309 70%,#b45309 100%) 0 0/2.6rem 100% repeat-x;-webkit-background-clip:text;background-clip:text;color:transparent;animation:spShine 2.6s linear infinite}
.st.hasspec i{position:absolute;font-style:normal;color:#f59e0b;font-size:.6rem;line-height:1;opacity:0;pointer-events:none;animation:spSpark 2.4s ease-in-out infinite}
.st.hasspec .sp1{top:-.2rem;left:0}.st.hasspec .sp2{top:30%;right:-.1rem;animation-delay:.8s}.st.hasspec .sp3{bottom:0;left:15%;animation-delay:1.6s}
@keyframes spShine{from{background-position:0 0}to{background-position:2.6rem 0}}
@keyframes spSpark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
.row.cur{border-width:3px;border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff);padding:.8rem .9rem;gap:.55rem}
.row.cur .nm{font-size:1.5rem;font-weight:800}
.row.cur .mo{font-size:1.5rem}
.row.cur .appr{font-size:1.35rem}
.row.cur .l2{flex-wrap:wrap}
.row.cur .stats{width:100%;justify-content:space-between;margin-top:.2rem}
.row.cur .st{width:auto;flex:1;gap:.2rem}
.row.cur .st b{font-size:1.4rem}
.row .sub{font-size:.85rem;color:var(--mute);line-height:1.35}
.row.out{opacity:.4}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.pc{display:flex;align-items:center;justify-content:center;gap:.35rem;border:1.5px solid var(--line);border-radius:.6rem;padding:.2rem .4rem;font-size:1.05rem;background:#fff;white-space:nowrap}
.pc b{font-weight:800}.pc .bn{color:#16a34a;font-weight:800;font-size:.85em}
.row.cur .pc{font-size:1.5rem;padding:.3rem .5rem}
.row.cur .stats{width:100%}
#side.dense .row{padding:.3rem .5rem;gap:.1rem}
#side.dense .row.cur{padding:.6rem .8rem;gap:.35rem}
#side.dense .st b{font-size:.85rem}
#side.dense .st .ic{width:1rem!important;height:1rem!important}
#side.dense{gap:.35rem}
.grp{border:1.5px dashed #9ca3af;border-radius:1rem;padding:.35rem;display:grid;gap:.35rem}
.grp .gl{display:flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:0 .3rem}

/* map */
#mapwrap{min-width:0;min-height:0;background:#bfe3f6;display:flex;position:relative}
#map,#sea{width:100%;height:100%;display:block}#sea{position:absolute;inset:0;pointer-events:none;will-change:transform}#map{position:relative;z-index:1}
.terr{transition:fill .4s}
.flash{animation:fl 1.2s ease 2}
@keyframes ra{50%{transform:translateY(-8px)}}
.nkflash{animation:nkfl .6s ease-out both}@keyframes nkfl{0%{opacity:.95}100%{opacity:0}}
.nkring,.nkfire,.nkcloud{transform-box:fill-box;transform-origin:center}
.nkring{animation:nkr 1.5s ease-out both}@keyframes nkr{0%{transform:scale(.3);opacity:1}100%{transform:scale(10);opacity:0}}
.nkfire{animation:nkf 2.6s ease-out both}@keyframes nkf{0%{transform:scale(.1);opacity:1}25%{transform:scale(1.7);opacity:1}100%{transform:scale(2.1);opacity:0}}
.nkcloud{animation:nkc 4.2s ease-out both}@keyframes nkc{0%{transform:scale(.15);opacity:0}15%{opacity:1}35%{transform:scale(1.15);opacity:1}100%{transform:scale(1.6);opacity:0}}
.nksink{animation:nks 3.2s ease-in-out both}@keyframes nks{0%{opacity:1;filter:none}100%{opacity:0;filter:blur(3px)}}
#map.shake,#sea.shake{animation:nkshake 1.1s linear}@keyframes nkshake{0%,100%{transform:none}8%{transform:translate(-14px,9px)}16%{transform:translate(12px,-10px)}24%{transform:translate(-11px,-8px)}32%{transform:translate(10px,9px)}42%{transform:translate(-7px,6px)}54%{transform:translate(6px,-5px)}68%{transform:translate(-4px,3px)}82%{transform:translate(2px,-2px)}}
.recarrow{animation:ra 1s ease-in-out infinite}
@keyframes mfl{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-52px)}}
.mfl{font:900 26px system-ui,sans-serif;fill:#16a34a;stroke:#fff;stroke-width:5px;paint-order:stroke;animation:mfl 1.9s ease-out both}
.mfl.tp{fill:#dc2626}
@keyframes rg{to{stroke-dashoffset:-28}}
@keyframes rp{50%{transform:scale(1.18)}}
@keyframes rf{50%{opacity:.25}}
.radglint{animation:rg 1.2s linear infinite,rf 1.6s ease-in-out infinite}
.radpulse circle:first-child{animation:rpw 1.4s ease-in-out infinite}@keyframes rpw{50%{r:29px;stroke-width:6px}}
@keyframes fl{50%{opacity:.35}}
.cand{cursor:pointer;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-17}}

/* panel */
#panel{border-left:1px solid var(--line);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem;overflow:auto}
.who{display:flex;align-items:center;gap:.7rem}
.who .nm{font-size:1.5rem;font-weight:800;line-height:1.05;flex:1}
.who .inc{white-space:nowrap;font-weight:700;font-size:.85rem;color:var(--pos);background:#dcfce7;border-radius:99px;padding:.2rem .7rem}
.scene{text-align:center;display:grid;justify-items:center;gap:.2rem;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.scene .em{font-size:5.5rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:bounce .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounce{from{transform:scale(.3) rotate(-15deg)}}
.scene h3{margin:0;font-size:2.3rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.scene p{margin:.1rem 0 0;font-size:1.3rem;line-height:1.35;color:#374151}
.tag{display:inline-block;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .7rem;border-radius:99px;background:var(--tc);color:#fff}
.opts{display:grid;gap:.5rem}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:.9rem;padding:.65rem 1rem;transition:border-color .12s,background .12s,transform .1s;background:#fff}
.opt:hover:not(:disabled){border-color:var(--tc);background:color-mix(in srgb,var(--tc) 6%,#fff);transform:translateY(-1px)}
.opt:disabled{opacity:.45}
.opt .ol{font-weight:800;font-size:1.3rem;line-height:1.2}
.opt .os{color:var(--mute);font-size:.95rem;margin-top:.1rem}
.opt.locked{border-style:dashed;background:var(--soft)}
.opt .ol .emo{margin-right:.4rem}
.det{display:grid;gap:.25rem;margin-top:.5rem}
.dl{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-weight:700;font-size:.9rem;padding:.1rem .55rem;border-radius:99px;background:var(--soft)}
.chip.pro{background:#fce7f3;color:#be185d}.chip.pos{background:#dcfce7}.chip.neg{background:#fee2e2}.chip.neu{background:var(--soft);color:var(--mute)}
.unrest{background:#fee2e2;border:2px solid #ef4444;color:#7f1d1d;border-radius:.8rem;padding:.7rem .9rem;margin:.6rem 0;font-size:1rem;line-height:1.35}.unrest.big{font-size:1.15rem}
.note{font-size:.88rem;color:var(--mute)}
.primary{background:var(--tc);color:#fff;font-weight:800;font-size:1.3rem;padding:1rem;border-radius:.9rem;width:100%;margin-top:auto;transition:filter .12s}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.primary:disabled{background:#d1d5db}
.ghost{border:2px solid var(--line);border-radius:.9rem;padding:.8rem;width:100%;font-weight:700;font-size:1.1rem}
.ghost:hover{border-color:#9ca3af}
.story{font-size:1.35rem;line-height:1.4;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{border:2px solid var(--line);border-radius:.9rem;padding:.8rem .4rem;text-align:center}
.tile small{display:block;color:var(--mute);font-weight:600}
.tile b{font-size:2.5rem;line-height:1.1;display:block}
.tile .now{font-size:.95rem;color:var(--mute)}
.extra{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.big{font-size:1.1rem}
.inv{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .7rem;align-items:center;padding:.5rem .1rem;border-bottom:1px solid var(--line)}
.inv .im b{font-size:1.15rem}
.inv .im small{display:block;color:var(--mute);font-size:.82rem;line-height:1.25}
.inv .ctl{display:flex;align-items:center;gap:.4rem}
.inv .ctl button{width:2.2rem;height:2.2rem;border-radius:.6rem;border:2px solid var(--line);font-weight:800;font-size:1.2rem;line-height:1}
.inv .ctl button:hover:not(:disabled){border-color:var(--tc);color:var(--tc)}
.inv .ctl button:disabled{opacity:.3}
.inv .lv{min-width:2.8rem;text-align:center;font-weight:800;font-size:1.3rem}
.inv .lv em{font-style:normal;color:var(--tc);font-size:.95rem;display:block;line-height:1}
.pts{display:flex;align-items:baseline;gap:.6rem}
.pts b{font-size:3.2rem;line-height:1;color:var(--tc)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;text-align:center}
.vs .n{font-size:3rem;font-weight:800;line-height:1}
.vs small{display:block;color:var(--mute);font-weight:600}
.bar{height:.7rem;border-radius:99px;background:#fee2e2;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc)}
.pick{display:flex;align-items:center;gap:.7rem}
.dot{width:1rem;height:1rem;border-radius:50%;display:inline-block}

/* menu + setup */
#modal{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;place-items:center;z-index:50}
#modal.on{display:grid}
.mcard{background:#fff;border-radius:1rem;padding:1.4rem;width:min(26rem,92vw);display:grid;gap:.6rem}
.mcard h2{margin:0}
.mcard.menucard{width:min(40rem,95vw);display:flex;flex-direction:column;gap:.6rem;max-height:96vh;overflow:auto;padding:1rem 1.2rem}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}.mhead h2{margin:0 0 .2rem;font-size:1.6rem;font-weight:900}
.mx{width:2.4rem!important;height:2.4rem;padding:0!important;border-radius:50%!important;flex:none}
.msec{background:var(--soft,#f3f4f6);border-radius:1rem;padding:.55rem .7rem;display:flex;flex-direction:column;gap:.4rem}
.msec h3{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:#fff;border-radius:.8rem;padding:.35rem .6rem}
.mrt{display:flex;flex-direction:column;min-width:0}.mrt span{font-size:.82rem;color:var(--mute);line-height:1.25}
.mtg{flex:none;margin:0!important}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.msec .ghost{margin:0!important;background:#fff}
.mbig{text-align:left;font-weight:700}
.mfoot{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.mfoot button{margin:0!important;padding:.7rem;font-size:1.05rem}.mgrid .ghost,.mbig{padding:.5rem!important}.mtg button{padding:.35rem .8rem!important}

.bigcard{width:min(46rem,94vw);padding:2.4rem;gap:1rem}.bigcard h2{font-size:2.8rem}.bigcard p{font-size:1.6rem;margin:0}.bigcard button{font-size:1.4rem;padding:1rem}
#setup{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;display:grid;place-items:start center;padding:2.5rem 1rem}
#setup.hide{display:none}
.scard{width:min(46rem,100%)}
.scard h1{margin:0 0 .3rem;font-size:2.4rem;letter-spacing:-.02em}
.scard>p{color:var(--mute);line-height:1.5;margin:.2rem 0 1.2rem;font-size:1.05rem}
.scard h3{margin:1.2rem 0 .5rem}
.scard h3 small{font-weight:500;color:var(--mute);font-size:.85rem;margin-left:.4rem}
.resume{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:2px solid var(--line);border-radius:.9rem;padding:.8rem 1rem;margin-bottom:1rem}
.resume .primary{width:auto;margin:0;padding:.6rem 1.2rem;font-size:1.05rem}
.ncount{display:flex;gap:.4rem}
.ncount button{min-width:3rem;height:3rem;padding:0 .9rem;border:2px solid var(--line);border-radius:.7rem;font-weight:800;font-size:1.1rem}
.ncount button.on{background:var(--text);border-color:var(--text);color:#fff}
.trow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:.8rem;padding:.5rem .7rem;margin-bottom:.5rem}
.trow .num{font-weight:800;width:1.2rem;color:var(--mute)}
.trow .iconbtn{border:2px solid var(--line);border-radius:.6rem;padding:.3rem}
.trow input[type=text]{flex:1;min-width:9rem;font:inherit;padding:.5rem .7rem;border-radius:.5rem;border:2px solid var(--line)}
.trow input[type=color]{width:3rem;height:2.6rem;border:0;background:none;padding:0;cursor:pointer}
.igrid{flex-basis:100%;display:flex;flex-wrap:wrap;gap:.3rem;padding-top:.3rem}
.igrid button{border:2px solid var(--line);border-radius:.6rem;padding:.3rem}
.igrid button:hover{border-color:#9ca3af}
#editbar{position:absolute;top:.8rem;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:.7rem 1rem;border-radius:.9rem;display:none;align-items:center;gap:.8rem;z-index:5;font-size:1.05rem;max-width:90%}
#editbar.on{display:flex}
#editbar button{background:#fff;color:#111827;border-radius:.6rem;padding:.4rem .9rem;font-weight:800}
#editor{position:fixed;inset:0;background:#fff;z-index:55;overflow:auto;padding:1.2rem}
#editor.hide{display:none}
.edwrap{display:grid;grid-template-columns:16rem 1fr;gap:1.4rem;max-width:72rem;margin:0 auto}
.edlist{display:grid;gap:.4rem;align-content:start}
.edlist button.t{display:flex;align-items:center;gap:.5rem;text-align:left;border:2px solid var(--line);border-radius:.7rem;padding:.5rem .7rem;font-weight:700}
.edlist button.t.on{border-color:var(--text);background:var(--soft)}
.edform h2{margin:0 0 .4rem}
.edform h4{margin:.9rem 0 .3rem}
.fr{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin:.6rem 0}
.fr label{display:grid;gap:.2rem;font-weight:600;font-size:.85rem;color:var(--mute)}
.fr input[type=text],.fr input[type=number]{font:inherit;color:var(--text);padding:.45rem .6rem;border:2px solid var(--line);border-radius:.5rem;width:7rem}
.fr input[type=text]{width:15rem}
.fr input[type=color]{width:3rem;height:2.4rem;border:0;padding:0;background:none}
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.3rem}
.abl{display:flex;gap:.4rem;align-items:center;font-size:.9rem;border:1px solid var(--line);border-radius:.5rem;padding:.25rem .5rem}
.abl small{color:var(--mute);margin-left:auto}
.danger{border:2px solid #fecaca;color:#b91c1c;border-radius:.7rem;padding:.6rem 1rem;font-weight:700}
.igrid2{display:flex;flex-wrap:wrap;gap:.3rem}
.igrid2 button{border:2px solid var(--line);border-radius:.6rem;padding:.3rem}
.gc{display:flex;align-items:center;justify-content:space-between;padding:.15rem .6rem;font-weight:700;color:#374151;font-size:.9rem}
.savein{font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.6rem;width:min(24rem,100%)}
#side{overflow-x:hidden}
#side *{min-width:0}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));flex:1}
.st{width:auto}
.row .l2{min-width:0;gap:.5rem}
.row .appr{flex:none}
.row .mo{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cur .mo{font-size:1.3rem}
.row.cur .stats{width:100%;margin-top:.2rem}
.row .sub{overflow-wrap:anywhere}
.grp .gl{white-space:normal;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.gc .stats{flex:1}
.st .ic{max-width:100%}
#win{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff,#fff3c4);overflow:hidden}
#win.hide{display:none}
#setup{background:linear-gradient(#e8f6ff,#fff 60%);place-items:start stretch;padding:0}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center}
.hero{position:relative;width:100%;height:min(52vh,30rem);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#fff,#d9f0ff)}
.htitle{position:relative;z-index:2;font-size:min(14vw,10rem);font-weight:900;letter-spacing:-.04em;line-height:1;color:#111827;text-shadow:0 .4rem 0 #fff}
.hsub{position:relative;z-index:2;font-size:1.3rem;color:var(--mute);font-weight:600;margin-top:.4rem}
.isl{position:absolute;z-index:1;animation:hfl 6s ease-in-out infinite alternate;opacity:.95}
.isl svg{width:100%;height:auto;display:block}
@keyframes hfl{to{transform:translateY(-.8rem) rotate(2deg)}}
.hcard{padding:1.5rem 1rem 2rem}
.vibe{margin-top:2.5rem;text-align:center;font-size:.8rem;color:var(--mute)}
.sw{display:flex;gap:.35rem;margin-left:auto}
.sw button{width:1.9rem;height:1.9rem;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px #111827}
#setup:has(.scard:not(.hcard)){place-items:start center;padding:2.5rem 1rem}
#win i{position:absolute;top:-2rem;width:.9rem;height:1.4rem;opacity:.9;animation:cf linear infinite}
@keyframes cf{to{transform:translateY(115vh) rotate(720deg)}}
.wcard{text-align:center;position:relative;z-index:2;padding:2rem;animation:wpop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes wpop{from{transform:scale(.4);opacity:0}}
.wcrown{font-size:7rem;line-height:1.1;animation:wb 1.1s ease-in-out infinite alternate}
@keyframes wb{to{transform:translateY(-1rem) rotate(6deg)}}
.wtag{font-weight:900;letter-spacing:.4em;font-size:1.6rem;color:var(--c)}
.wlogo{display:flex;justify-content:center;margin:.6rem 0}

function polyArea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return Math.abs(a/2)}

function islandShape(rng,R){
  const n=140,k=[2+Math.floor(rng()*3),3+Math.floor(rng()*4),5+Math.floor(rng()*4)];
  const a=[.09+rng()*.1,.04+rng()*.06,.02+rng()*.035],ph=[rng()*6.28,rng()*6.28,rng()*6.28];
  const sx=.85+rng()*.35,sy=.85+rng()*.3,rot=rng()*3.14;
  const pts=[];
  for(let i=0;i<n;i++){
    const th=i/n*Math.PI*2,rad=R*(1+a[0]*Math.sin(k[0]*th+ph[0])+a[1]*Math.sin(k[1]*th+ph[1])+a[2]*Math.sin(k[2]*th+ph[2]));
    const x=Math.cos(th)*rad*sx,y=Math.sin(th)*rad*sy;
    pts.push([x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  return{pts,rb:Math.max(...pts.map(q=>Math.hypot(q[0],q[1])))};
}
function shapesClash(A,ax,ay,B,bx,by,gap){
  if(Math.hypot(ax-bx,ay-by)>=A.rb+B.rb+gap)return false;
  const pa=A.pts.filter((_,i)=>i%3===0),pb=B.pts.filter((_,i)=>i%3===0);
  for(const p of pa)for(const q of pb)if(Math.hypot(p[0]+ax-q[0]-bx,p[1]+ay-q[1]-by)<gap)return true;
  const bp=B.pts.map(q=>[q[0]+bx,q[1]+by]),ap=A.pts.map(q=>[q[0]+ax,q[1]+ay]);
  if(inPoly(bp,ax,ay)||inPoly(ap,bx,by))return true;
  return false;
}
const MAPDIM=z=>z==='large'?[1800,1700]:[1000,950];
function placeIslands(rng,size){
  const [MW,MH]=MAPDIM(size);
  const base=size==='small'?[150,128,108,92,76]:size==='large'?[218,201,190,178,167,155,147,138,129,121,113,106,99,92]:[168,150,132,118,106,90,76];
  let best=null;
  for(let attempt=0,sc=1;attempt<90;attempt++,sc*=.975){
    const shapes=base.map(r=>islandShape(rng,r*sc)),placed=[];let ok=true;
    for(const s of shapes){
      let done=false;
      for(let t=0;t<600&&!done;t++){
        const mx=s.rb+8,x=mx+rng()*(MW-2*mx),y=mx+rng()*(MH-2*mx);
        if(placed.every(q=>!shapesClash(s,x,y,q.s,q.x,q.y,26))){placed.push({s,x,y});done=true}
      }
      if(!done){ok=false;break}
    }
    if(ok)return placed;
    best=placed;
  }
  return best;

function seedIsland(rng,poly,count,area,bb){
  let dmin=Math.sqrt(area/count)*.85,seeds=[];
  for(let at=0;seeds.length<count&&at<30000;at++){
    const p=[bb[0]+rng()*(bb[2]-bb[0]),bb[1]+rng()*(bb[3]-bb[1])];
    if(!inPoly(poly,p[0],p[1]))continue;
    if(seeds.every(s=>Math.hypot(s[0]-p[0],s[1]-p[1])>=dmin))seeds.push(p);
    if(at%500===499)dmin*=.93;
  }
  const pts=[];
  for(let x=bb[0];x<bb[2];x+=7)for(let y=bb[1];y<bb[3];y+=7)if(inPoly(poly,x,y))pts.push([x,y]);
  const dep=pts.map(p=>{let m=1e18;for(const q of poly){const d=(q[0]-p[0])**2+(q[1]-p[1])**2;if(d<m)m=d}return Math.sqrt(m)}),mxd=Math.max(...dep,1),wt=dep.map(d=>.45+LANDW*Math.pow(d/mxd,1.3));
  for(let it=0;it<30;it++){
    const acc=seeds.map(()=>[0,0,0]);
    pts.forEach((p,pi)=>{let bi=0,bd=1e18;for(let i=0;i<seeds.length;i++){const d=(p[0]-seeds[i][0])**2+(p[1]-seeds[i][1])**2;if(d<bd){bd=d;bi=i}}const w=wt[pi];acc[bi][0]+=p[0]*w;acc[bi][1]+=p[1]*w;acc[bi][2]+=w});
    seeds=seeds.map((s,i)=>{if(!acc[i][2])return s;const c=[acc[i][0]/acc[i][2],acc[i][1]/acc[i][2]];return inPoly(poly,c[0],c[1])?c:s});
  }
  return seeds;
}
function clipHalf(poly,nx,ny,c){
  const out=[];

    const a=poly[i],b=poly[(i+1)%poly.length],da=nx*a[0]+ny*a[1]-c,db=nx*b[0]+ny*b[1]-c;
    if(da<=0)out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}

const CELL=5200,LANDW=0;
function genMap(seed,size){
  const rng=mulberry(seed),placed=placeIslands(rng,size),islands=[],terrs=[];
  const names=TNAMES.slice();for(let i=names.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[names[i],names[j]]=[names[j],names[i]]}
  placed.forEach((p,ii)=>{
    const poly=p.s.pts.map(q=>[q[0]+p.x,q[1]+p.y]);
    islands.push({d:'M'+poly.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z'});
    const area=polyArea(poly),count=Math.max(2,Math.round(area/(CELL*(size==='large'?1.5:1))));
    const xs=poly.map(q=>q[0]),ys=poly.map(q=>q[1]),bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
    const seeds=seedIsland(rng,poly,count,area,bb),base=terrs.length;
    seeds.forEach((s,i)=>{
      let cell=[[bb[0]-20,bb[1]-20],[bb[2]+20,bb[1]-20],[bb[2]+20,bb[3]+20],[bb[0]-20,bb[3]+20]];
      seeds.forEach((o,j)=>{if(j===i)return;const nx=o[0]-s[0],ny=o[1]-s[1];cell=clipHalf(cell,nx,ny,nx*(s[0]+o[0])/2+ny*(s[1]+o[1])/2)});
      terrs.push({id:base+i,isl:ii,x:s[0],y:s[1],d:'M'+cell.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z',adj:[],def:3+Math.floor(rng()*8),owner:null,name:(()=>{const q=base+i,L=names.length;return q<L?names[q]:(['New','Upper','Lower','East','West','Port','Saint','Old'][Math.floor(q/L)-1]||'Far')+' '+names[q%L]})()});
    });
    const st=5,cols=Math.ceil((bb[2]-bb[0])/st)+1,rows=Math.ceil((bb[3]-bb[1])/st)+1,grid=new Int16Array(cols*rows).fill(-1);
    for(let cx=0;cx<cols;cx++)for(let cy=0;cy<rows;cy++){

      let bi=0,bd=1e18;for(let i=0;i<seeds.length;i++){const d=(x-seeds[i][0])**2+(y-seeds[i][1])**2;if(d<bd){bd=d;bi=i}}

    }
    const link=(a,b)=>{if(a<0||b<0||a===b)return;const A=terrs[base+a],B=terrs[base+b];if(!A.adj.includes(B.id))A.adj.push(B.id);if(!B.adj.includes(A.id))B.adj.push(A.id)};
    for(let cx=0;cx<cols;cx++)for(let cy=0;cy<rows;cy++){const a=grid[cx*rows+cy];if(a<0)continue;if(cx+1<cols)link(a,grid[(cx+1)*rows+cy]);if(cy+1<rows)link(a,grid[cx*rows+cy+1])}
    const comp=new Array(seeds.length).fill(-1);let nc=0;
    for(let i=0;i<seeds.length;i++){if(comp[i]>=0)continue;const q=[i];comp[i]=nc;while(q.length){const a=q.pop();terrs[base+a].adj.forEach(id=>{const b=id-base;if(comp[b]<0){comp[b]=nc;q.push(b)}})}nc++}
    while(nc>1){
      let bd=1e18,pa=0,pb=0;
      for(let i=0;i<seeds.length;i++)for(let j=0;j<seeds.length;j++)if(comp[i]!==comp[j]){const d=Math.hypot(seeds[i][0]-seeds[j][0],seeds[i][1]-seeds[j][1]);if(d<bd){bd=d;pa=i;pb=j}}

function markCoast(map){

    const pts=is.d.replace(/^M/,'').replace(/Z$/,'').split('L').map(p=>p.split(',').map(Number)),ts=map.terrs.filter(x=>x.isl===i);

function pickCaps(map,n){

const specLvl=()=>Math.max(1,Math.round(40*((G&&G.pace)||1)));
const specs=t=>t.specs||(t.specs=[]);

const specTaken=k=>G.teams.some(x=>!x.gone&&specs(x).includes(k));
const pushNotice=n=>{if(G.notice)(G.noticeQ=G.noticeQ||[]).push(n);else G.notice=n};
const SPEC_INHERIT=false; /* set to true to bring back taking a specialty when you eliminate a team */
function inheritSpec(k,d){
  if(!SPEC_INHERIT)return;
  const got=specs(d).filter(x=>!specs(k).includes(x));
  specs(d).forEach(x=>{if(!specs(k).includes(x))specs(k).push(x)});d.specs=[];
  if(got.length&&G.specOn)pushNotice({big:true,emoji:SPEC[got[0]].e,title:`${esc(k.name)} gains a specialty!`,text:`${esc(k.name)} took over ${esc(d.name)}'s specialty: <b>${got.map(x=>SPEC[x].name).join(', ')}</b>.`});
}
const allUpgrades=(t,k)=>Object.keys(AB).filter(i=>AB[i].k===k&&!AB[i].leg).every(i=>t.abs.includes(i));
function checkSpec(){
  if(!G.specOn||G.phase==='place'||G.edit)return;
  const L=specLvl(),c=[];
  G.teams.forEach(t=>{if(t.out||t.gone||t.specUnlocked)return;MK.forEach(k=>{if(t.stats[k]>=L&&!specTaken(k)&&allUpgrades(t,k))c.push([t,k])})});
  c.sort((a,b)=>b[0].stats[b[1]]-a[0].stats[a[1]]);
  c.forEach(([t,k])=>{if(t.specUnlocked||specTaken(k))return;specs(t).push(k);t.specUnlocked=true;pushNotice({big:true,emoji:SPEC[k].e,title:`${esc(t.name)} unlocks a specialty!`,text:`<b>${SPEC[k].name}</b>: ${SPEC[k].desc}`})});
}

}

}

function offers(t){
  return Object.keys(AB).filter(id=>{const a=AB[id];return !a.leg&&!hasAb(t,id)&&t.stats[a.k]>=abReq(a)&&Object.keys(AB).every(o=>{const b=AB[o];return b.leg||b.k!==a.k||b.n>=a.n||t.abs.includes(o)})}).sort((x,y)=>AB[x].n-AB[y].n||MK.indexOf(AB[x].k)-MK.indexOf(AB[y].k));
}
function decCount(t){
  const d=fx(t,'dec');
  let n=1+d;
  return Math.min(4,n);
}
function pickEvent(t){
  const rec=t.recent,fresh=list=>{const f=list.filter(k=>!rec.includes(k));return pick(f.length?f:list)};
  const remember=k=>{rec.push(k);if(rec.length>14)rec.shift();return k};
  if(t.approval<2.5&&!locked5(t)&&chance(t.approval<1?.7:t.approval<1.5?.5:.3))return{key:remember(fresh(UNSTABLE))};
  if(chance(.08))return{key:remember(fresh(BONUS))};
  const se=SE.filter(x=>stat(t,x[0])>=need(x[1])&&!rec.includes(x[2])).map(x=>x[2]);
  if(se.length&&chance(.4))return{key:remember(pick(se))};
  if(t.sinceTax>=6&&chance(.4)){t.sinceTax=0;return{key:'tax'}}
  const cands=[];for(let i=0;i<4;i++){const k=fresh(NORMAL);if(!cands.includes(k))cands.push(k)}
  const vals=cands.map(k=>evValue(t,k)),alive=G.teams.filter(x=>!x.out&&!x.gone),avg=alive.reduce((q,x)=>q+(x.luck||0),0)/Math.max(1,alive.length),d=(t.luck||0)-avg;
  let ix=Math.floor(Math.random()*cands.length);
  const best=f=>vals.reduce((b,v,i)=>f(v)>f(vals[b])?i:b,0);
  if((t.dry||0)>=2&&vals.some(v=>v.gain>=15))ix=best(v=>v.gain);
  else if(d<-25)ix=best(v=>v.best);
  else if(d>25)ix=best(v=>-v.best);
  t.dry=vals[ix].gain>=15?0:(t.dry||0)+1;
  return{key:remember(cands[ix])};
}
function evValue(t,key){
  let best=-1e9,gain=0;
  try{EV[key](t).choices.forEach(c=>{if(c.need&&!hasAb(t,'schools'))return;let v=0,m=0;c.out.forEach(o=>{const x=adjOut(t,o);v+=o.p*(x.da*20+x.dm);m+=o.p*x.dm});if(v>best)best=v;if(m>gain)gain=m})}catch(e){best=0}
  return{best,gain};
}
function evDef(t,ev){

    const a=AB[ev.ab],cost=abCost(t,a);
    return E(a.e,a.name,`${a.story} ${a.desc}`,[
      {label:`Invest ${mon(cost)}`,sub:'A permanent upgrade',cost,clear:true,out:[{p:1,a:a.a,m:-cost,raw:true,ab:ev.ab,text:`${a.name} is ready! ${a.desc}`}]},
      {label:'Not now',sub:'You might be offered it again later',clear:true,out:[{p:1,a:0,m:0,text:'You decided to wait.'}]}],{tag:'Opportunity'});

}
function bits(t,o){
  const {da,dm}=adjOut(t,o),b=[];
  if(Math.abs(da)>=.05)b.push(hasSpec(t,'pro')?`<span class="chip pro">${svg('star',.85,'currentColor',1)}—</span>`:`<span class="chip ${da>0?'pos':'neg'}">${svg('star',.85,'currentColor',1)}${sg(da)}</span>`);

  if(o.tax)b.push(`<span class="chip neu">Tax ${o.tax>0?'+':'−'}${Math.abs(o.tax)}%</span>`);

}
function insight(t,c,edu){
  if(c.clear||hasAb(t,'golden'))return `<div class="det">${c.out.map(o=>`<div class="dl">${c.out.length>1?`<b>${Math.round(o.p*100)}%</b>`:''}${bits(t,o).join('')||'<span class="chip neu">no change</span>'}</div>`).join('')}</div>`;
  if(hasAb(t,'uni')){

function applyOut(t,o){
  const {da,dm}=adjOut(t,o),before={a:t.approval,m:t.money};
  setAppr(t,t.approval+da);
  const short=dm<0?Math.max(0,-(t.money+dm)):0;
  t.money=Math.max(0,t.money+dm);
  const extra=[];
  if(short>0){const pen=r1(Math.min(2,.3+short/80)*damp(t));setAppr(t,t.approval-pen);extra.push(`Not enough money! Unhappy citizens: −${pen.toFixed(1)} stars`)}
  if(o.tax){t.tax=clamp(t.tax+o.tax,5,45);extra.push(`Tax rate is now ${t.tax}%`)}
  if(o.s)for(const k in o.s){if(k==='mil'&&hasClass(t,'pac'))continue;t.stats[k]=Math.max(t.stats[k],Math.min(capOf(k,t),t.stats[k]+o.s[k]));extra.push(`+${o.s[k]} ${SN[k]}`)}
  if(o.ab){t.abs.push(o.ab);extra.push('Unlocked: '+AB[o.ab].name)}
  return{text:o.text,da:r1(t.approval-before.a),dm:Math.round(t.money-before.m),extra,a:t.approval,m:t.money};
}
function pickChoice(i){
  if(G.phase!=='event'||G.ev.res)return;
  const t=cur(),c=evDef(t,G.ev).choices[i];if(!c)return;
  if(c.need&&!hasAb(t,'schools'))return;
  if(c.cost&&t.money<c.cost)return;
  let r=Math.random(),o=c.out[c.out.length-1];
  for(const x of c.out){r-=x.p;if(r<=0){o=x;break}}
  G.ev.res=applyOut(t,o);
  const rs=G.ev.res;t.luck=(t.luck||0)+rs.da*20+rs.dm;
  if((G.decLeft||0)===0&&fx(t,'endAppr')>0&&!t.out){const b=t.approval;setAppr(t,b+fx(t,'endAppr'));rs.da=r1(rs.da+t.approval-b);rs.a=t.approval;if(t.approval>b)rs.extra.push('📺 State Media: +'+r1(t.approval-b)+' star')}
  render();
}
function toInvest(){
  G.unaff=null;G.phase='invest';G.alloc={mil:0,edu:0,tech:0,eco:0,str:0,pro:0};
  const t=cur();
  if(hasClass(t,'ana')){let n=Math.round(pointsFor(t)*1.5);const ks=MK.filter(k=>capOf(k)>t.stats[k]);while(n>0&&ks.length){const k=pick(ks);G.alloc[k]++;n--;if(t.stats[k]+G.alloc[k]>=capOf(k))ks.splice(ks.indexOf(k),1)}}
  render();
}

function toOpps(){const t=cur(),o=offers(t);if(!o.length){toInvest();return}const [af,un]=splitOpps(t,o);G.opps=af;G.unaff=un;G.oppAll=af.slice();G.hadOpp=true;G.oppRes=false;G.phase='opp';render()}

/* ================= TURN FLOW ================= */
function nextTurn(){
  const c0=cur();if(c0)c0.borrowed=null;
  if(c0&&c0.last){c0.last=false;if(!lands(c0).length){c0.out=true;c0.group=G.gid++}}
  let guard=0;
  let wrapped=false;
  do{G.turn=(G.turn+1)%G.teams.length;if(G.turn===0){G.round++;wrapped=true}}while(cur().out&&++guard<500);
  if(wrapped&&G.round===PEACE)G.notice={big:true,title:'Round 10: the peace is over!',text:'Teams can now <b>attack each other</b> and <b>form alliances</b>.'};
  startTurn();
}
let ANIM=null;
function startAnim(t,inc,taps){
  const L=lands(t);ANIM=null;if(!L.length||G.phase==='place')return;
  const per=Math.floor(inc/L.length),rem=inc-per*L.length,items=L.map((x,i)=>({x:x.x,y:x.y,txt:`+$${per+(i===0?rem:0)}M`,cls:'',d:i*110}));
  let d=L.length*110+250;
  taps.forEach(({o,take})=>{const q=G.map.terrs.find(z=>z.owner===o.id&&z.id===o.capital)||G.map.terrs.find(z=>z.owner===o.id);if(q){items.push({x:q.x,y:q.y,txt:`−$${take}M`,cls:'tp',d});d+=160}});

}

  }

function startTurn(){
  const t=cur();
  t.sinceTax++;t.borrowed=null;t.dome=null;['nukeCd','blitzCd','learnCd','smearCd','borrowCd','domeCd'].forEach(k=>{if(t[k]>0)t[k]--});
  const inc=income(t);t.money+=inc;
  let tap=0;const taps=[],tm=Math.min(80,fx(t,'tap'));
  if(tm>0)G.teams.forEach(o=>{if(o.out||o.group===t.group)return;const take=Math.min(Math.round(o.money),tm);if(take>0){o.money-=take;tap+=take;taps.push({o,take})}});
  startAnim(t,inc,taps);
  t.money+=tap;
  let drift=(20-t.tax)*.04+fx(t,'appr')-Math.max(0,t.approval-3.5)*.1;const a0=t.approval;setAppr(t,t.approval+drift);
  G.tinfo={inc,tap,drift:r1(t.approval-a0)};
  if(t.approval<1&&!locked5(t)){
    t.unrest=(t.unrest||0)+1;
    const own=lands(t),keep=own.find(x=>x.id===t.capital)||own[0],pool=own.filter(x=>x!==keep).sort(()=>Math.random()-.5),lost=pool.slice(0,Math.min(t.unrest,pool.length));
    lost.forEach(x=>{x.owner=null});
    G.tinfo.rev={n:t.unrest,lost:lost.map(x=>x.name)};G.flash=lost.map(x=>x.id);

  if(t.last){G.decTotal=1;G.decLeft=0;G.ev=null;G.phase='action';G.act={mode:'menu'};G.alloc=null;G.actTotal=1+fx(t,'acts');G.actsLeft=G.actTotal;pushNotice({big:true,emoji:'🙏',title:`${esc(t.name)}: one last turn`,text:'Win any land back this turn to survive. Ships let you reach any coast.'});render();return}
  const n=decCount(t);G.decTotal=n;G.decLeft=n-1;G.hadOpp=false;G.opps=null;G.oppRes=false;
  G.ev=pickEvent(t);G.phase='event';G.act={mode:'menu'};G.alloc=null;

function winCheck(){
  if(!G||G.phase==='place')return;
  const al=G.teams.filter(x=>!x.out&&!x.gone);
  if(al.length===1&&G.teams.filter(x=>!x.gone).length>=2&&!al.some(a=>G.teams.some(o=>o!==a&&!o.gone&&!o.out&&o.group===a.group))){if(!G.won){G.won=true;G.winSeen=false}G.winner=al[0].id}
  else if(al.length===0&&G.teams.some(x=>!x.gone)){if(!G.won){G.won=true;G.winSeen=false}G.winner=null}
  else if(al.length>1){
    G.won=false;
    if(al.every(x=>x.group===al[0].group)){al.forEach(x=>{x.group=G.gid++});G.notice={title:'The alliance has ended',text:`Only ${al.map(x=>esc(x.name)).join(' and ')} are left, so their alliance is over. Only one team can win. Fight it out!`}}
  }
}
function checkElim(){
  if(G.phase==='place')return;
  if(!G.elimSeen){G.elimSeen=G.teams.filter(t=>t.out||t.gone).map(t=>t.id);return}
  const live=G.teams.filter(x=>!x.out&&!x.gone).length;
  G.teams.forEach(t=>{if(t.out&&!t.gone&&!G.elimSeen.includes(t.id)){G.elimSeen.push(t.id);
    if(live<=1)return;
    const n={big:true,emoji:'💀',title:`${esc(t.name)} has been eliminated!`,text:'They have no countries left and are out of the game.'};
    if(G.notice)(G.noticeQ=G.noticeQ||[]).push(n);else G.notice=n}});
}

function archSave(i){const x=setup.list[i];if(!x)return;try{const v=JSON.parse(localStorage.getItem(SP+x.name));v.archived=!x.arch;localStorage.setItem(SP+x.name,JSON.stringify(v));if(G&&G.saveName===x.name)G.archived=v.archived}catch(e){}renderSetup()}
function delSave(i){const x=setup.list[i];if(!x||!confirm(`Delete the save "${x.name}"? This cannot be undone.`))return;localStorage.removeItem(SP+x.name);if(G&&G.saveName===x.name)G.saveName=null;renderSetup()}
function saveSnapshot(){const n=prompt('Name for this snapshot (you stay in the current game):');if(!n||!n.trim())return;const nn=uniqueName(n.trim()),c=JSON.parse(JSON.stringify(G,(k,v)=>k==='edit'?undefined:v));c.saveName=nn;c.savedAt=Date.now();localStorage.setItem(SP+nn,JSON.stringify(c));closeModal()}
function renameSave(){const n=prompt('New name for this save:',G.saveName||'');if(!n||!n.trim()||n.trim()===G.saveName)return;const nn=uniqueName(n.trim());if(G.saveName)localStorage.removeItem(SP+G.saveName);G.saveName=nn;save();closeModal();render()}

/* ================= TEACHER EDITOR ================= */
const ed={sel:0,icons:false,tpl:null};
function showEditor(){
  if(!G.teams[ed.sel]||G.teams[ed.sel].gone)ed.sel=Math.max(0,G.teams.findIndex(t=>!t.gone));
  ed.tpl=null;ed.icons=false;$('#editor').classList.remove('hide');renderEditor();
}
function fixLife(){
  G.teams.forEach(t=>{
    if(t.gone)return;const has=G.map.terrs.some(x=>x.owner===t.id);
    if(!has&&!t.out&&!t.last){t.out=true;t.group=G.gid++}else if(has&&t.out)t.out=false;
  });
}
function closeEditor(){
  $('#editor').classList.add('hide');fixLife();
  if(cur().out){nextTurn();return}
  render();
}
function edSelect(i){ed.sel=i;ed.tpl=null;ed.icons=false;renderEditor()}
function edIcons(){ed.icons=!ed.icons;renderEditor()}
function edSet(i,f,v){
  const t=G.teams[i];
  if(f==='name')t.name=String(v).trim()||t.name;
  else if(f==='color')t.color=v;
  else if(f==='icon'){t.icon=v;ed.icons=false}
  else if(f==='money')t.money=Math.max(0,Math.round(+v)||0);
  else if(f==='approval')t.approval=clamp(Math.round((+v||0)*10)/10,0,5);
  else if(f==='tax')t.tax=clamp(Math.round(+v)||20,5,45);
  else if(f.startsWith('s_'))t.stats[f.slice(2)]=Math.max(0,Math.round(+v)||0);
  save();render();renderEditor();
}
function edAb(i,id,on){
  const t=G.teams[i],has=t.abs.includes(id);
  if(on&&!has)t.abs.push(id);if(!on&&has)t.abs=t.abs.filter(x=>x!==id);
  setAppr(t,t.approval);save();render();
}
function edCls(i,v){const t=G.teams[i];if(v)t.cls=v;else delete t.cls;save();render();renderEditor()}
function edSpec(i,k,on){
  const t=G.teams[i],a=specs(t);
  if(on&&!a.includes(k)&&!specTaken(k))a.push(k);
  if(!on)t.specs=a.filter(x=>x!==k);
  t.specUnlocked=specs(t).length>0;
  setAppr(t,t.approval);save();render();renderEditor();
}
function edLand(i){G.edit={mode:'assign',team:i};$('#editor').classList.add('hide');render()}
function endEdit(){G.edit=null;fixLife();$('#editor').classList.remove('hide');render();renderEditor()}
function edLeave(i){const t=G.teams[i];t.group=G.gid++;save();render();renderEditor()}
function edRemove(i){
  const t=G.teams[i];
  if(G.teams.filter(x=>!x.out&&!x.gone).length<=1&&!t.out){alert('You need at least one team.');return}
  if(!confirm(`Remove ${t.name}? Their countries become neutral.`))return;
  G.map.terrs.forEach(x=>{if(x.owner===i)x.owner=null});
  t.out=true;t.gone=true;t.group=G.gid++;
  ed.sel=Math.max(0,G.teams.findIndex(x=>!x.gone));save();render();renderEditor();
}
function edNew(){
  const used=G.teams.filter(t=>!t.gone),unusedN=NAMES.filter(n=>!used.some(t=>t.name===n)),unusedC=COLORS.filter(c=>!used.some(t=>t.color===c));
  ed.tpl={name:unusedN[0]||('Team '+(used.length+1)),icon:pick(LOGOS),color:unusedC[0]||('#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'))};
  ed.icons=false;renderEditor();
}
function edTpl(f,v){ed.tpl[f]=v;if(f==='icon')ed.icons=false;renderEditor()}
function edPlace(){
  if(!ed.tpl.name.trim())return;
  G.edit={mode:'late',tpl:Object.assign({},ed.tpl),sel:null};$('#editor').classList.add('hide');render();
}
function cancelLate(){G.edit=null;$('#editor').classList.remove('hide');render();renderEditor()}
function confirmLate(){
  const E=G.edit,tpl=E.tpl,terrId=E.sel;if(terrId==null)return;
  const al=G.teams.filter(x=>!x.out&&!x.gone),n=Math.max(1,al.length),avg=f=>Math.round(al.reduce((q,x)=>q+f(x),0)/n);
  const stats={};MK.forEach(k=>stats[k]=avg(x=>x.stats[k]));
  const abs=Object.keys(AB).filter(id=>al.length&&al.filter(x=>x.abs.includes(id)).length*2>=n);
  const id=G.teams.length;
  G.teams.push({id,name:tpl.name.trim(),icon:tpl.icon,color:tpl.color,money:avg(x=>x.money),approval:r1(al.reduce((q,x)=>q+x.approval,0)/n)||2.5,tax:20,stats,abs,group:G.gid++,out:false,gone:false,capital:terrId,recent:[],offered:{},sinceTax:0,nukeCd:0,scout:null});
  G.won=false;G.map.terrs[terrId].owner=id;G.flash=[terrId];G.edit=null;ed.sel=id;ed.tpl=null;
  $('#editor').classList.remove('hide');render();renderEditor();
}
function renderEditor(){
  const list=G.teams.filter(t=>!t.gone);
  const left=`<div class="edlist"><h3 style="margin:0 0 .3rem">Teams</h3>${list.map(t=>`<button class="t ${ed.sel===t.id&&!ed.tpl?'on':''}" onclick="edSelect(${t.id})">${svg(t.icon,1.4,t.color,.15)}${esc(t.name)}${t.out?' (out)':''}</button>`).join('')}<button class="t ${ed.tpl?'on':''}" onclick="edNew()">+ Add a new team</button><button class="primary" style="margin-top:1rem" onclick="closeEditor()">Done</button></div>`;
  let right='';
  if(ed.tpl){
    const T=ed.tpl;
    right=`<div class="edform"><h2>Add a new team</h2><p class="mute">The new team starts with the average money, approval, stats and common abilities of all current teams. You will pick their starting country on the map.</p>
    <div class="fr"><button class="iconbtn" style="border:2px solid var(--line);border-radius:.6rem;padding:.3rem" onclick="edIcons()">${svg(T.icon,2,T.color,.15)}</button>
    <label>Name<input type="text" value="${esc(T.name)}" maxlength="20" onchange="ed.tpl.name=this.value"></label>
    <label>Colour<input type="color" value="${T.color}" onchange="edTpl('color',this.value)"></label></div>
    ${ed.icons?`<div class="igrid2">${LOGOS.map(ic=>`<button onclick="edTpl('icon','${ic}')">${svg(ic,2,T.color,.15)}</button>`).join('')}</div>`:''}
    <button class="primary" style="width:auto;margin-top:1rem;padding:.8rem 1.4rem" onclick="edPlace()">Choose starting country on the map</button></div>`;
  }else{
    const t=G.teams[ed.sel];
    if(!t){right='<div class="edform">No teams.</div>'}
    else right=`<div class="edform"><h2>${esc(t.name)}</h2>
    <div class="fr"><button style="border:2px solid var(--line);border-radius:.6rem;padding:.3rem" onclick="edIcons()">${svg(t.icon,2,t.color,.15)}</button>
    <label>Name<input type="text" value="${esc(t.name)}" maxlength="20" onchange="edSet(${t.id},'name',this.value)"></label>
    <label>Colour<input type="color" value="${t.color}" onchange="edSet(${t.id},'color',this.value)"></label></div>
    ${ed.icons?`<div class="igrid2">${LOGOS.map(ic=>`<button onclick="edSet(${t.id},'icon','${ic}')">${svg(ic,2,t.color,.15)}</button>`).join('')}</div>`:''}
    <div class="fr"><label>Money ($M)<input type="number" value="${Math.round(t.money)}" min="0" onchange="edSet(${t.id},'money',this.value)"></label>
    <label>Approval (0-5)<input type="number" value="${t.approval.toFixed(1)}" min="0" max="5" step="0.1" onchange="edSet(${t.id},'approval',this.value)"></label>
    <label>Tax %<input type="number" value="${t.tax}" min="5" max="45" step="5" onchange="edSet(${t.id},'tax',this.value)"></label></div>
    <h4>Stats</h4><div class="fr">${MK.map(k=>`<label>${SN[k]}<input type="number" value="${t.stats[k]}" min="0" onchange="edSet(${t.id},'s_${k}',this.value)"></label>`).join('')}</div>
    <h4>Countries: ${lands(t).length}</h4><div class="fr"><button class="ghost" style="width:auto;padding:.6rem 1rem" onclick="edLand(${t.id})">Assign countries on the map</button>${POOL(t).length>1?`<button class="ghost" style="width:auto;padding:.6rem 1rem" onclick="edLeave(${t.id})">Remove from alliance</button>`:''}</div>
    <h4>Class</h4><div class="fr" style="flex-wrap:wrap"><select onchange="edCls(${t.id},this.value)"><option value="">None</option>${Object.keys(CLS).map(k=>`<option value="${k}" ${t.cls===k?'selected':''}>${CLS[k].e} ${CLS[k].name}</option>`).join('')}</select>${G.classOn?'':'<span class="mute">Classes are switched off in the Menu, so this has no effect yet.</span>'}</div>
    <h4>Specialty (one per game, one per team)</h4><div class="abg">${MK.map(k=>{const own=G.teams.find(x=>!x.gone&&specs(x).includes(k)),mine=own===t,blocked=own&&!mine;return `<label class="abl"><input type="checkbox" ${mine?'checked':''} ${blocked?'disabled':''} onchange="edSpec(${t.id},'${k}',this.checked)"><span class="emo">${SPEC[k].e}</span>${SPEC[k].name}<small>${blocked?esc(own.name):SN[k]}</small></label>`}).join('')}</div>${G.specOn?'':'<p class="mute" style="margin:.3rem 0 0">Specialties are switched off in the Menu, so these have no effect yet.</p>'}
    <h4>Abilities (tick to give, untick to remove)</h4>
    ${MK.map(k=>`<div class="note" style="margin-top:.5rem"><b>${SN[k]}</b></div><div class="abg">${Object.keys(AB).filter(id=>AB[id].k===k&&(!AB[id].leg||t.abs.includes(id))).sort((a,b)=>(AB[a].leg-AB[b].leg)||(AB[a].ln-AB[b].ln)).map(id=>`<label class="abl"><input type="checkbox" ${t.abs.includes(id)?'checked':''} onchange="edAb(${t.id},'${id}',this.checked)"><span class="emo">${AB[id].e}</span>${AB[id].name}<small>${AB[id].leg?'old':abReq(AB[id])}</small></label>`).join('')}</div>`).join('')}
    <div style="margin-top:1.4rem"><button class="danger" onclick="edRemove(${t.id})">Remove this team</button></div></div>`;
  }
  $('#editor').innerHTML=`<div class="edwrap">${left}${right}</div>`;
}
initSetup();archiveLegacy();showSetup();
</script>
<div id="tip"></div><svg id="xhair" viewBox="-30 -30 60 60"><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"><circle r="16"/><path d="M0,-28V-9M0,9V28M-28,0H-9M9,0H28"/></g><g fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"><circle r="16"/><path d="M0,-28V-9M0,9V28M-28,0H-9M9,0H28"/></g><circle r="2.5" fill="#dc2626"/></svg>
</body>
